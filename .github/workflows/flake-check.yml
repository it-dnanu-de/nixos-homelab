name: flake-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v13
      - uses: DeterminateSystems/magic-nix-cache-action@v9
        with:
          skip-save: true   # post-run cache upload hangs the job for 10+ min; the check itself is fast
      - name: nix flake check
        run: nix flake check --all-systems
      - name: build configuration (eval gate)
        run: nix build .#nixosConfigurations.homelab.config.system.build.toplevel --no-link
